name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CHORUS_VERSION: 1.1.0
  RENODE_VERSION: 1.16.1
  RENODE_RP2040_COMMIT: 5aca847c9f57ed96603e55d28e8ceeefa09e55f6

jobs:
  cortex-m:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch littlefs
        run: git submodule update --init ports/littlefs/upstream ports/lwip/upstream

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Install chorus
        run: |
          sudo curl -sSfL -o /usr/local/bin/chorus "https://github.com/z3nnix/chorus/releases/download/${CHORUS_VERSION}/chorus.bin"
          sudo chmod +x /usr/local/bin/chorus

      - name: Build
        run: >
          chorus all
          test_task_delete.elf test_scheduler.elf test_semaphore.elf test_mutex.elf
          test_mqueue.elf test_sleep_list.elf test_pool.elf test_uart_rx.elf test_shell.elf
          test_console.elf test_task_info.elf test_shell_cmds.elf
          test_device.elf test_gpio.elf test_spi.elf test_i2c.elf test_pwm.elf
          test_fs.elf test_shell_fs.elf test_littlefs.elf
          test_net.elf test_net_qemu.elf

      - name: Run tests on QEMU
        run: |
          failed=0
          for t in task_delete scheduler semaphore mutex mqueue sleep_list pool uart_rx shell console task_info shell_cmds device gpio spi i2c pwm fs shell_fs littlefs net; do
            echo "::group::test_${t}"
            out=$(printf 'bedrock\n' | timeout 10 qemu-system-arm -M lm3s6965evb -nographic -kernel "test_${t}.elf" || true)
            echo "$out"
            echo "::endgroup::"
            if ! grep -q "=== All Tests Complete ===" <<< "$out"; then
              echo "::error::test_${t} did not complete"
              failed=1
            elif grep -q "FAIL" <<< "$out"; then
              echo "::error::test_${t} reported failures"
              failed=1
            fi
          done
          exit $failed

      - name: Run network test on QEMU
        run: |
          out=$(timeout 30 qemu-system-arm -M lm3s6965evb -nographic -nic user,model=stellaris -kernel test_net_qemu.elf < /dev/null || true)
          echo "$out"
          grep -q "=== All Tests Complete ===" <<< "$out"
          ! grep -q "FAIL" <<< "$out"

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch littlefs
        run: git submodule update --init ports/littlefs/upstream ports/lwip/upstream

      - name: Install chorus
        run: |
          sudo curl -sSfL -o /usr/local/bin/chorus "https://github.com/z3nnix/chorus/releases/download/${CHORUS_VERSION}/chorus.bin"
          sudo chmod +x /usr/local/bin/chorus

      - name: Build
        run: chorus host

      - name: Run tests
        run: |
          failed=0
          for t in task_delete scheduler semaphore mutex mqueue sleep_list pool uart_rx shell console task_info shell_cmds device gpio spi i2c pwm fs shell_fs littlefs fatfs net; do
            echo "::group::test_${t}_host"
            out=$(printf 'bedrock\n' | timeout 5 "./test_${t}_host" || true)
            echo "$out"
            echo "::endgroup::"
            if ! grep -q "=== All Tests Complete ===" <<< "$out"; then
              echo "::error::test_${t}_host did not complete"
              failed=1
            elif grep -q "FAIL" <<< "$out"; then
              echo "::error::test_${t}_host reported failures"
              failed=1
            fi
          done
          exit $failed

  riscv32:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm git riscv64-elf-gcc qemu-system-riscv

      - uses: actions/checkout@v4

      - name: Fetch littlefs
        run: git submodule update --init ports/littlefs/upstream ports/lwip/upstream

      - name: Install chorus
        run: |
          curl -sSfL -o /usr/local/bin/chorus "https://github.com/z3nnix/chorus/releases/download/${CHORUS_VERSION}/chorus.bin"
          chmod +x /usr/local/bin/chorus

      - name: Build
        run: chorus riscv32

      - name: Run tests on QEMU
        run: |
          failed=0
          for t in task_delete scheduler semaphore mutex mqueue sleep_list pool uart_rx shell console task_info shell_cmds device gpio spi i2c pwm fs shell_fs littlefs fatfs net; do
            echo "::group::test_${t}_riscv32"
            out=$(printf 'bedrock\n' | timeout 10 qemu-system-riscv32 -M virt -bios none -nographic -kernel "test_${t}_riscv32.elf" || true)
            echo "$out"
            echo "::endgroup::"
            if ! grep -q "=== All Tests Complete ===" <<< "$out"; then
              echo "::error::test_${t}_riscv32 did not complete"
              failed=1
            elif grep -q "FAIL" <<< "$out"; then
              echo "::error::test_${t}_riscv32 reported failures"
              failed=1
            fi
          done
          exit $failed

      - name: Run network test on QEMU
        run: |
          out=$(timeout 30 qemu-system-riscv32 -M virt -bios none -nographic -global virtio-mmio.force-legacy=false -netdev user,id=n0 -device virtio-net-device,netdev=n0 -kernel test_net_qemu_riscv32.elf < /dev/null || true)
          echo "$out"
          grep -q "=== All Tests Complete ===" <<< "$out"
          ! grep -q "FAIL" <<< "$out"

  rp2040:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch littlefs
        run: git submodule update --init ports/littlefs/upstream ports/lwip/upstream

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install chorus
        run: |
          sudo curl -sSfL -o /usr/local/bin/chorus "https://github.com/z3nnix/chorus/releases/download/${CHORUS_VERSION}/chorus.bin"
          sudo chmod +x /usr/local/bin/chorus

      - name: Install Renode and RP2040 models
        run: |
          mkdir -p "$RUNNER_TEMP/renode"
          curl -sSfL "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz" | tar xz -C "$RUNNER_TEMP/renode" --strip-components=1
          git clone -q https://github.com/matgla/Renode_RP2040 "$RUNNER_TEMP/Renode_RP2040"
          git -C "$RUNNER_TEMP/Renode_RP2040" checkout -q "$RENODE_RP2040_COMMIT"

      - name: Build
        run: chorus rp2040

      - name: Run tests on Renode
        run: |
          failed=0
          for t in task_delete scheduler semaphore mutex mqueue sleep_list pool uart_rx shell console task_info shell_cmds device gpio spi i2c pwm fs shell_fs littlefs fatfs; do
            echo "::group::test_${t}_rp2040"
            out_file="$RUNNER_TEMP/test_${t}_rp2040.txt"
            timeout 300 "$RUNNER_TEMP/renode/renode" --disable-gui --console \
              -e "\$rp2040=@$RUNNER_TEMP/Renode_RP2040; \$fw=@$PWD/test_${t}_rp2040.elf; \$out=@$out_file; include @$PWD/boards/rpi-pico/renode.resc; emulation RunFor \"0.5\"; sysbus.uart0 WriteLine \"bedrock\"; emulation RunFor \"2\"; quit" > /dev/null 2>&1 || true
            out=$(cat "$out_file" 2>/dev/null || true)
            echo "$out"
            echo "::endgroup::"
            if ! grep -q "=== All Tests Complete ===" <<< "$out"; then
              echo "::error::test_${t}_rp2040 did not complete"
              failed=1
            elif grep -q "FAIL" <<< "$out"; then
              echo "::error::test_${t}_rp2040 reported failures"
              failed=1
            fi
          done
          exit $failed

      - uses: actions/upload-artifact@v4
        with:
          name: bedrock_example_rp2040
          path: bedrock_example_rp2040.uf2

  stm32f103:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch littlefs
        run: git submodule update --init ports/littlefs/upstream ports/lwip/upstream

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install chorus
        run: |
          sudo curl -sSfL -o /usr/local/bin/chorus "https://github.com/z3nnix/chorus/releases/download/${CHORUS_VERSION}/chorus.bin"
          sudo chmod +x /usr/local/bin/chorus

      - name: Install Renode
        run: |
          mkdir -p "$RUNNER_TEMP/renode"
          curl -sSfL "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz" | tar xz -C "$RUNNER_TEMP/renode" --strip-components=1

      - name: Build
        run: chorus stm32f103

      - name: Run tests on Renode
        run: |
          failed=0
          for t in task_delete scheduler semaphore mutex mqueue sleep_list pool uart_rx shell console task_info shell_cmds device gpio spi i2c pwm fs shell_fs littlefs; do
            echo "::group::test_${t}_stm32f103"
            out_file="$RUNNER_TEMP/test_${t}_stm32f103.txt"
            timeout 300 "$RUNNER_TEMP/renode/renode" --disable-gui --console \
              -e "\$fw=@$PWD/test_${t}_stm32f103.elf; \$out=@$out_file; include @$PWD/boards/stm32f103c8-bluepill/renode.resc; emulation RunFor \"0.5\"; sysbus.usart1 WriteLine \"bedrock\"; emulation RunFor \"2\"; quit" > /dev/null 2>&1 || true
            out=$(cat "$out_file" 2>/dev/null || true)
            echo "$out"
            echo "::endgroup::"
            if ! grep -q "=== All Tests Complete ===" <<< "$out"; then
              echo "::error::test_${t}_stm32f103 did not complete"
              failed=1
            elif grep -q "FAIL" <<< "$out"; then
              echo "::error::test_${t}_stm32f103 reported failures"
              failed=1
            fi
          done
          exit $failed

      - uses: actions/upload-artifact@v4
        with:
          name: bedrock_example_stm32f103
          path: bedrock_example_stm32f103.bin
